name: Trading-Bot

on:
  schedule:
    # 15:07 UTC = 11:07 New York (Sommer) bzw. 10:07 (Winter) -> immer waehrend der US-Handelszeit
    - cron: "7 15 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Was soll passieren?"
        type: choice
        required: true
        default: "dry run (show plan, no trades)"
        options:
          - "dry run (show plan, no trades)"
          - "backtest"
          - "compare variants"
          - "trade now"

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt matplotlib

      - name: Modus bestimmen
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mode=trade
          else
            case "${{ inputs.action }}" in
              "trade now") mode=trade ;;
              "backtest") mode=backtest ;;
              "compare variants") mode=variants ;;
              *) mode=dryrun ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Modus: $mode"

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Secrets pruefen
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "::error::Die Secrets APCA_API_KEY_ID und APCA_API_SECRET_KEY fehlen. Siehe README, Schritt 3."
            exit 1
          fi

      - name: Dry run (nur Plan)
        if: steps.mode.outputs.mode == 'dryrun'
        run: |
          status=0
          python bot.py --dry-run > plan.md || status=$?
          cat plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Plan (Dry Run)::$(python .github/notice.py < plan.md)"
          exit $status

      - name: Handeln
        if: steps.mode.outputs.mode == 'trade'
        run: python bot.py

      - name: Backtest
        if: steps.mode.outputs.mode == 'backtest'
        run: |
          status=0
          python backtest.py > backtest.md || status=$?
          cat backtest.md
          echo "::notice title=Backtest::$(python .github/notice.py < backtest.md)"
          exit $status

      - name: Varianten vergleichen
        if: steps.mode.outputs.mode == 'variants'
        run: |
          status=0
          python backtest.py --variants > backtest.md || status=$?
          cat backtest.md
          echo "::notice title=Varianten::$(python .github/notice.py < backtest.md)"
          exit $status

      - name: Backtest-Diagramm hochladen
        if: always() && (steps.mode.outputs.mode == 'backtest' || steps.mode.outputs.mode == 'variants')
        uses: actions/upload-artifact@v5
        with:
          name: backtest
          path: backtest.png
          if-no-files-found: warn

      - name: Tagebuch committen
        if: always() && steps.mode.outputs.mode == 'trade'
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          if [ -d journal ]; then git add journal; fi
          if git diff --cached --quiet; then
            echo "Keine Aenderungen am Tagebuch."
            exit 0
          fi
          git commit -m "Tagebuch $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Tagebuch konnte nicht gepusht werden."
          exit 0
